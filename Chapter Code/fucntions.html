<!DOCTYPE html>
<html lang="en">
<head>
  <title>Functions</title>
</head>
<body>
  <script>
    let age=21;

    function printAge(){
      console.log(`Your age is ${age}`);
    }
    age =76;
    printAge();

    age =1;
    printAge();



    function generateRandomMove(){
      let random = Math.random();
      let randomMove= random* 3;
      return randomMove;
    }

    console.log(generateRandomMove());
    console.log(generateRandomMove());
    console.log(generateRandomMove());
    console.log(generateRandomMove());
    console.log(generateRandomMove());



    function determineDriveStatus(){
      let age=21;
      let status;
      if(age>18){
        status='You can drive';
      }
      else{
        status='Use a bicycle';
      }
      return status;
    }
    console.log(determineDriveStatus());

    function sum(a,b){
      let sum=a+b;
      return sum;
    }

    let num=sum(4,5);
    console.log(num);

    function greeting(name='Pyaare'){
      console.log(`Namaste ${name} uncle`);
    }

    greeting();
  </script>
</body>
</html>
